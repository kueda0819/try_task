<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>ToDo</h1>
  <form id="form">
    <input id="input" type="text" placeholder="新しいタスクを入力" autocomplete="off" required>
    <button type="submit">追加</button>
  </form>
  <nav id="filters">
    <button data-filter="all" class="active">すべて</button>
    <button data-filter="active">未完了</button>
    <button data-filter="done">完了</button>
  </nav>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button id="clear" type="button">完了済みを削除</button>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
